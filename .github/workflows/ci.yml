name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Lint
        run: vp lint

      - name: Type check
        run: ./node_modules/.bin/tsc -b

      - name: Build static page
        run: |
          vp build
          node scripts/render-static.mjs
